name: ci
on: [push, pull_request]

jobs:
  build-and-test:
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - name: configure
        run: cmake -S . -B build
      - name: build
        run: cmake --build build --config Release
      - name: test
        run: ctest --test-dir build -C Release --output-on-failure
